    "name": "An Arbor Polytope with Nonreal Ehrhart Roots",
    "description": "A singleton-labeled rooted arbor with 243 vertices has an Ehrhart polynomial with a nonreal root. The formalization proves the lattice-count identity at every natural dilation, identifies the polynomial uniquely, establishes a nonreal complex root, and refutes universal real-rootedness for this allowed class. The proof uses a finite-deficit bijection, exact moment identities, and a negative Laguerre expression for an explicit quintic. It does not address the distinct h*-root assertion or minimal counterexample size.",
